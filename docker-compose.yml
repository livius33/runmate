# Self-host with Docker Compose: Postgres + Runmate + the daily sync. See docs/SELF-HOST.md.
#   cp .env.example .env   # fill in Clerk keys, ENCRYPTION_KEY, CRON_SECRET, POSTGRES_PASSWORD
#   docker compose up -d   # http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runmate
      POSTGRES_DB: runmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runmate -d runmate"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies drizzle/*.sql that are not applied yet, then exits. Runs on every `up`.
  migrate:
    build: { context: ., target: builder }
    command: ["npx", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgres://runmate:${POSTGRES_PASSWORD}@db:5432/runmate
    depends_on:
      db: { condition: service_healthy }

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://runmate:${POSTGRES_PASSWORD}@db:5432/runmate
      PORT: "3000"                     # inside the container; PORT in .env only picks the host port
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Daily sync of every user with a connected pull source (Garmin login), 06:00 UTC like the Vercel cron.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    command:
      - sh
      - -c
      - |
        echo '0 6 * * * wget -qO- --header "Authorization: Bearer '"$$CRON_SECRET"'" http://app:3000/api/cron/daily-sync' > /etc/crontabs/root
        exec crond -f -l 8
    depends_on: [app]

volumes:
  pgdata:
